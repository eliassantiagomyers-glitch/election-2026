<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chico 2026 city council elections — ChicoSol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<div class="dash">

  <div class="map-wrap" id="map"></div>

  <div class="race-list" id="race-list"></div>

</div>

<script>
(function () {
  // measure the content box, not the document, so the iframe can shrink as well as grow
  function send() {
    var dash = document.querySelector('.dash');
    var h = Math.ceil(dash ? dash.getBoundingClientRect().height : document.body.offsetHeight);
    parent.postMessage({ type: 'chicosol-embed-height', height: h }, '*');
  }
  send();
  window.addEventListener('load', send);
  window.addEventListener('resize', send);
  new MutationObserver(send).observe(document.body, { childList: true, subtree: true, attributes: true });
})();
</script>

<script src="js/districts.js?v=6"></script>
<script src="js/roads.js?v=6"></script>
<script src="js/data.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
