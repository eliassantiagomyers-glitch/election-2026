<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chico 2026 local elections map — ChicoSol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dash">

  <!-- app.js writes CFG.title / CFG.subtitle into these and will crash if
       they're missing, so they stay in the DOM but never render -->
  <h1 id="dash-title" hidden></h1>
  <p id="dash-subtitle" hidden></p>

  <div class="layer-toggle" role="group" aria-label="Choose which races to show">
    <button type="button" data-layer="council" aria-pressed="true">City Council</button>
    <button type="button" data-layer="school" aria-pressed="false">School Board</button>
  </div>

  <div class="map-wrap" id="map">
    <div class="race-card" id="card" role="dialog" aria-live="polite"></div>
  </div>

  <!-- app.js removes this itself unless live_election is on -->
  <span class="last-updated" id="last-updated" hidden></span>

</div>

<script>
(function () {
  function send() {
    parent.postMessage({ type: 'chicosol-embed-height', height: document.documentElement.scrollHeight }, '*');
  }
  send();
  window.addEventListener('load', send);
  window.addEventListener('resize', send);
  new MutationObserver(send).observe(document.body, { childList: true, subtree: true, attributes: true });
})();
</script>

<script src="js/districts.js"></script>
<script src="js/roads.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
