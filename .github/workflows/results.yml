name: Update election results

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_results.py
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add js/data.js .clarity_version
          git diff --cached --quiet && echo "nothing to commit" || \
            (git commit -m "Results update $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
